[package]
name = "mocktioneer-adapter-fastly"
description = "Fastly Compute adapter for Mocktioneer (wasm32-wasip1)."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[[bin]]
name = "mocktioneer-adapter-fastly"
path = "src/main.rs"

[features]
default = []
fastly = ["edgezero-adapter-fastly/fastly"]

[dependencies]
edgezero-adapter-fastly = { workspace = true }
log = { workspace = true }
mocktioneer-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
edgezero-adapter-fastly = { workspace = true, features = ["fastly"] }
edgezero-core = { workspace = true }
fastly = { workspace = true }

# Contract tests seed the typed-config blob in-process (no Viceroy fixture).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
