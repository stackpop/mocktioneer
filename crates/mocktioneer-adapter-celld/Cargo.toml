[package]
name = "mocktioneer-adapter-celld"
description = "Local celld Worker adapter for Mocktioneer."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["celld"]
celld = ["edgezero-adapter-celld/celld"]

[dependencies]
base64 = { workspace = true }
edgezero-adapter-celld = { workspace = true, default-features = false }
edgezero-core = { workspace = true }
mocktioneer-core = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
edgezero-adapter-celld = { workspace = true, features = ["celld"] }
worker = { workspace = true }

[lints]
workspace = true
