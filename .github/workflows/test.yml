name: "Run Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Check feature compilation
        run: cargo check --workspace --all-targets --features "fastly cloudflare"

  adapter-wasm-tests:
    name: ${{ matrix.adapter }} wasm tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: cloudflare
            target: wasm32-unknown-unknown
            runner_env: CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER
            runner_value: wasm-bindgen-test-runner
          - adapter: fastly
            target: wasm32-wasip1
            runner_env: CARGO_TARGET_WASM32_WASIP1_RUNNER
            runner_value: viceroy run
          - adapter: spin
            target: wasm32-wasip1
            runner_env: CARGO_TARGET_WASM32_WASIP1_RUNNER
            runner_value: wasmtime run
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.adapter }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.adapter }}-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}

      - name: Add wasm target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve wasm-bindgen CLI version
        if: matrix.adapter == 'cloudflare'
        id: wasm-bindgen-version
        shell: bash
        run: |
          version="$(
            awk '
              $1 == "name" && $3 == "\"wasm-bindgen\"" { in_pkg=1; next }
              in_pkg && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock
          )"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `--force` overwrites a cache-restored binary (cargo install would
      # otherwise refuse); `--locked` keeps the version pinned and reproducible.
      - name: Install wasm-bindgen test runner
        if: matrix.adapter == 'cloudflare'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wasm-bindgen-version.outputs.version }}" --locked --force

      - name: Resolve Viceroy version
        if: matrix.adapter == 'fastly'
        id: viceroy-version
        shell: bash
        run: echo "version=$(grep '^viceroy ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Version comes from `.tool-versions` so local dev and CI share a single
      # source of truth.
      - name: Setup Viceroy
        if: matrix.adapter == 'fastly'
        run: cargo install viceroy --version "${{ steps.viceroy-version.outputs.version }}" --locked --force

      - name: Setup Wasmtime
        if: matrix.adapter == 'spin'
        run: |
          if ! command -v wasmtime &>/dev/null; then
            curl https://wasmtime.dev/install.sh -sSf | bash
            echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Run ${{ matrix.adapter }} wasm contract tests
        env:
          ${{ matrix.runner_env }}: ${{ matrix.runner_value }}
        run: cargo test -p mocktioneer-adapter-${{ matrix.adapter }} --features ${{ matrix.adapter }} --target ${{ matrix.target }} --test contract

  playwright:
    name: playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Retrieve tool versions
        id: tool-versions
        run: |
          echo "rust=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "node=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.tool-versions.outputs.rust }}

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 30
