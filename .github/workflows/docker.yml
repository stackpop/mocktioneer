# Builds and publishes the Mocktioneer Docker image to ghcr.io/stackpop/mocktioneer.
#
# Tagging strategy:
#   - Pull requests:    7-char commit SHA  (e.g. a1b2c3d)
#   - Push to main:     latest
#   - GitHub release:   v1.2.3, 1.2.3, 1.2  (semver variants from the release tag)
#   - Manual dispatch:  the git ref you provide
#
# PR images are only pushed when the PR originates from this repo (not forks).
# Concurrent builds on the same ref cancel earlier runs.

name: "Build & Publish Docker Image"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA). Defaults to the default branch."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The official `rust` image does not publish every patch release as its
      # own tag (1.98.1 has no `-slim-bookworm` variant, while the `1.98` alias
      # tracks the newest published patch). Fall back to the minor alias when
      # the exact patch tag is absent so a toolchain bump in `.tool-versions`
      # can't break the image build on a tag that was never pushed.
      - name: Get Rust version from .tool-versions
        id: rust
        shell: bash
        run: |
          version="$(grep '^rust ' .tool-versions | awk '{print $2}')"
          test -n "$version"
          if ! docker manifest inspect "rust:${version}-slim-bookworm" >/dev/null 2>&1; then
            echo "rust:${version}-slim-bookworm is not published; using rust:${version%.*}-slim-bookworm"
            version="${version%.*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stackpop/mocktioneer
          tags: |
            # PR builds: tag with 7-char commit SHA (no prefix)
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'pull_request' }}
            # Push to main: tag as latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            # Release: tag with version from release tag
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            # workflow_dispatch: tag with provided ref
            type=raw,value=${{ inputs.ref || github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once and load locally (no registry push yet) so the smoke test
      # can gate publication — a broken image must never reach its final tag.
      # Labels are applied HERE so the smoke-tested image is byte-for-byte what
      # gets pushed below (the publish step only re-tags and pushes it).
      - name: Build and load for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: mocktioneer:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: RUST_VERSION=${{ steps.rust.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — reachable on mapped port and serves bids
        run: |
          cid="$(docker run -d -p 8787:8787 mocktioneer:ci-smoke)"
          # Wait for the mapped host port — proves the container binds 0.0.0.0,
          # not 127.0.0.1 (a loopback bind would make this fail).
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          # The baked-in config blob should let the auction endpoint serve a bid.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/openrtb2/auction \
            -H 'content-type: application/json' \
            -d '{"id":"t","imp":[{"id":"1","banner":{"w":300,"h":250}}]}')"
          echo "auction status: $code"
          docker logs "$cid" 2>&1 | tail -20 || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          test "$code" = "200"

      # Publish the EXACT image the smoke test validated — re-tag the loaded
      # `mocktioneer:ci-smoke` and push, rather than rebuilding. No cache-hit
      # assumption, and the pushed bytes are literally what was tested.
      - name: Push validated image
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag mocktioneer:ci-smoke "$tag"
            docker push "$tag"
          done
