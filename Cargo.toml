[workspace]
members = [
  "crates/mocktioneer-core",
  "crates/mocktioneer-adapter-axum",
  "crates/mocktioneer-adapter-cloudflare",
  "crates/mocktioneer-adapter-fastly",
  "crates/mocktioneer-adapter-spin",
  "crates/mocktioneer-cli",
]
resolver = "2"

[workspace.package]
authors = ["Mocktioneer Team <dev@stackpop.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.1"
edgezero-adapter-axum = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-adapter-axum", default-features = false }
edgezero-adapter-cloudflare = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-adapter-cloudflare", default-features = false }
edgezero-adapter-fastly = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-adapter-fastly", default-features = false }
edgezero-adapter-spin = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-adapter-spin", default-features = false }
edgezero-cli = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-cli" }
edgezero-core = { git = "https://github.com/stackpop/edgezero.git", tag = "v0.0.7", package = "edgezero-core" }
fastly = "0.12.1"
futures = { version = "0.3", features = ["std", "executor"] }
futures-util = "0.3.32"
handlebars = "6"
js-sys = "0.3"
log = { version = "0.4", features = ["serde"] }
mocktioneer-core = { path = "crates/mocktioneer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
sha2 = "0.10"
simple_logger = "5"
spin-sdk = { version = "~6.0", default-features = false, features = ["http", "key-value", "variables"] }
subtle = "2"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v7", "js"] }
validator = { version = "0.20", features = ["derive"] }
worker = { version = "0.8.3", features = ["http"] }

[workspace.lints.clippy]
# Mirrors the edgezero workspace strict-clippy gate. Every additional
# exception lives at the call site as a documented `#[allow]` or
# `#[expect]` rather than a workspace allow.
pedantic = { level = "warn", priority = -1 }
restriction = { level = "deny", priority = -1 }

# Meta — required when enabling `restriction` as a group.
blanket_clippy_restriction_lints = "allow"

# Documentation — private items don't need full docs.
missing_docs_in_private_items = "allow"

# Style / formatting — match idiomatic Rust conventions.
implicit_return = "allow"
question_mark_used = "allow"
single_call_fn = "allow"
separated_literal_suffix = "allow"
# `pub_with_shorthand` wants `pub(in crate)` but rustfmt unconditionally
# rewrites that to `pub(crate)`. The two spellings can't both be satisfied.
pub_with_shorthand = "allow"
# `module_name_repetitions` conflicts with the flat re-export surface used
# across the core/adapter crates (e.g. handler/query types in `routes.rs`).
module_name_repetitions = "allow"

# `pattern_type_mismatch` and `ref_patterns` are mutually exclusive in modern
# Rust — every `if let Some(x) = &foo` flags the first, every
# `*foo { Variant(ref x) => ... }` flags the second. We pick match-ergonomics.
pattern_type_mismatch = "allow"

# API design — `exhaustive_structs` fires on the unit struct generated by
# `edgezero_core::app!`.
exhaustive_structs = "allow"
exhaustive_enums = "allow"

# Imports / paths
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
